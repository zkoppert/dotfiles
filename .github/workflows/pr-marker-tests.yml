name: pr-marker-tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Run on 3.9 to enforce the CPython 3.9.6 floor bin/pr-marker targets.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.9'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.19.0'
          package-manager-cache: false
      - name: Install Pi SDK contract
        run: |
          npm install --prefix "$RUNNER_TEMP/pi-sdk" --no-audit --no-fund @earendil-works/pi-coding-agent@1.3.0
          printf '%s\n' "$RUNNER_TEMP/pi-sdk/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Run Pi runtime contract tests
        run: python3 -m unittest -v test_pi_treehouse scripts.test_skill_metadata
      - name: Verify instruction migration
        run: python3 scripts/verify_instruction_migration.py && python3 -m unittest scripts/test_verify_instruction_migration.py
      - name: Run pr-marker / gh-guard gate tests
        run: python3 bin/test_pr_marker.py
      - name: Run test-quality checker tests
        run: python3 .copilot/skills/test-quality/test_check.py
      - name: Run memory-sweep tests
        run: python3 .copilot/skills/memory-sweep/tests.py
      - name: Run record-demo tests
        run: PYTHONPATH=.copilot/skills/record-demo python3 -m unittest discover -s .copilot/skills/record-demo -p 'test_*.py'
      - name: Run install and package guard tests
        run: python3 test_install.py && python3 test_pr_size_guard.py && python3 test_cfs_package_guard.py && python3 test_triage_dependabot_wrapper.py
      - name: Run babysit-prs wrapper tests
        run: python3 test_babysit_prs_wrapper.py
      - name: Run durable Codespace Copilot tests
        run: python3 test_copilot2.py && python3 test_copilot_codespace_session.py && python3 test_copilot_environment.py && python3 test_setup_copilot2_codespace.py
      - name: Run accessibility picker wrapper tests
        run: python3 test_accessibility_issue_picker_wrapper.py
      - name: Install accessibility test dependency
        run: python3 -m pip install pytest==8.4.2
      - name: Run accessibility picker tests
        run: python3 -m pytest -q scripts/test_accessibility_issue_picker.py scripts/test_resume_accessibility_session.py
