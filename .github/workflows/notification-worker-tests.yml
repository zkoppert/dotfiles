name: notification-worker-tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  triage-notifications:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13.0'
      - name: Install test dependencies
        run: python3 -m pip install pytest==9.1.1 -r python/notification-worker-requirements.txt
      - name: Run triage-notifications tests
        run: python3 -m pytest .copilot/skills/triage-notifications/tests.py -q

  triage-dependabot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13.0'
      - name: Install test dependencies
        run: python3 -m pip install pytest==9.1.1 -r python/notification-worker-requirements.txt
      - name: Run triage-dependabot tests
        run: python3 -m pytest .copilot/skills/triage-dependabot/tests.py -q
