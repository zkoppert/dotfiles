name: notification-worker-tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  notification-workers:
    runs-on: ubuntu-24.04
    container:
      image: python:3.13.0-bookworm@sha256:91a40c9db8e53aa8c4cae96c24dc7135835e07c8140de233826ece4442ca8e29
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: triage-notifications
            test_file: .copilot/skills/triage-notifications/tests.py
          - suite: triage-dependabot
            test_file: .copilot/skills/triage-dependabot/tests.py
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install test dependencies
        run: python -m pip install --require-hashes -r python/notification-worker-requirements.lock.txt
      - name: Run ${{ matrix.suite }} tests
        run: python -m pytest ${{ matrix.test_file }} -q
