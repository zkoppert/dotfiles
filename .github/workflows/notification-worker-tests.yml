name: notification-worker-tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  triage-notifications:
    runs-on: ubuntu-24.04
    container:
      image: python:3.13.0-bookworm@sha256:91a40c9db8e53aa8c4cae96c24dc7135835e07c8140de233826ece4442ca8e29
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install test dependencies
        run: python -m pip install --require-hashes -r python/notification-worker-requirements.lock.txt
      - name: Run triage-notifications tests
        run: python -m pytest .copilot/skills/triage-notifications/tests.py -q

  triage-dependabot:
    runs-on: ubuntu-24.04
    container:
      image: python:3.13.0-bookworm@sha256:91a40c9db8e53aa8c4cae96c24dc7135835e07c8140de233826ece4442ca8e29
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install test dependencies
        run: python -m pip install --require-hashes -r python/notification-worker-requirements.lock.txt
      - name: Run triage-dependabot tests
        run: python -m pytest .copilot/skills/triage-dependabot/tests.py -q
